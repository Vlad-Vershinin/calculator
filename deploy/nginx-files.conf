# Пример отдельного Nginx server block для сдачи задания.
# Next.js обслуживает этот порт локально на 127.0.0.1:3000.
server {
    listen 5001 default_server;
    listen [::]:5001 default_server;
    server_name _;

    access_log /var/log/nginx/calculator-files.access.log;
    error_log /var/log/nginx/calculator-files.error.log;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
